services:
  kafka:
    image: apache/kafka:4.1.2
    hostname: kafka
    ports:
      - "9094:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker, controller"
      CLUSTER_ID: "3k5h-Z4URPGlbJUlKvEdCQ"

      # Listeners
      KAFKA_LISTENERS: "HOST://:9092, INTERNAL://:19092, CONTROLLER://:29093"
      
      # Advertised listeners
      KAFKA_ADVERTISED_LISTENERS: "HOST://localhost:9094, INTERNAL://kafka:19092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "HOST:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"

      # giao tiep giua cac thanh phan kafka
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"

      # cấu hìn môi tường chỉ có 1 broker
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"

      # Quản lý topic và dữ liệu
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
      KAFKA_LOG_RETENTION_HOURS: "24" 
    volumes:
      - kafka-data:/var/lib/kafka/data
  spark: 
    image: spark:3.5.9-scala2.12-java17-python3-ubuntu
    hostname: spark
    working_dir: /opt/spark/jobs
    depends_on:
      - kafka
    ports:
      - "4040:4040"
    volumes:
      - ./spark/jobs:/opt/spark/jobs
    command: ["sleep", "infinity"]
    
volumes:
  kafka-data:
    