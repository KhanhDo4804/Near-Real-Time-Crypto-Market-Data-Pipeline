crypto_market:
  target: dev
  outputs:
    dev:
      type: redshift
      method: iam

      host: "{{ env_var('REDSHIFT_HOST') }}"
      port: "{{ env_var('REDSHIFT_PORT') | int }}"
      dbname: "{{ env_var('REDSHIFT_DATABASE') }}"
      schema: "{{ env_var('REDSHIFT_SCHEMA') }}"
      user: "{{ env_var('REDSHIFT_USER') }}"

      region: "{{ env_var('AWS_REGION') }}"
      is_serverless: true
      serverless_work_group: "{{ env_var('REDSHIFT_WORKGROUP') }}"
      serverless_acct_id: "{{ env_var('REDSHIFT_ACCOUNT_ID') }}"

      threads: 1
      sslmode: verify-full
      connect_timeout: 600